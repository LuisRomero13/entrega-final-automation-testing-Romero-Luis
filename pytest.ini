[pytest]
addopts = -v --html=reports/reporte.html --self-contained-html
testpaths = tests test_api
markers =
    smoke: verificaciones básicas rápidas de que la aplicación funciona
    api: tests de API/backend
    ui: tests de interfaz de usuario
    regression: suite completa de regresión
    e2e: flujo end-to-end encadenado entre peticiones
